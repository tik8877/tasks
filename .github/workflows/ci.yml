name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    # adjust runner label to match your server (e.g. 'server3')
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker build --target test -t kubsu:test docker/

      - name: Create docker network
        run: |
          docker network create ci_network || true

      - name: Start Postgres
        run: |
          docker run -d --name ci_db --network ci_network \
            -e POSTGRES_USER=kubsu -e POSTGRES_PASSWORD=kubsu -e POSTGRES_DB=kubsu \
            postgres:15-alpine

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do \
            docker run --network ci_network --rm postgres:15-alpine pg_isready -h ci_db -p 5432 && break || sleep 1; \
          done

      - name: Run tests in built image
        env:
          DATABASE_URL: postgresql+psycopg://kubsu:kubsu@ci_db:5432/kubsu
        run: |
          docker run --network ci_network --rm -e DATABASE_URL=$DATABASE_URL kubsu:test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci_db || true
          docker network rm ci_network || true
