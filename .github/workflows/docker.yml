name: Docker CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up disk space
        run: |
          echo "=== Checking disk space before cleanup ==="
          df -h /
          echo "=== Cleaning up ==="
          podman system prune -f || true
          podman image prune -f || true
          podman container prune -f || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Reset podman network state
        run: |
          echo "=== Resetting podman network state ==="
          pkill -f aardvark-dns || true
          pkill -f netavark || true
          podman network rm -f test-net || true
          podman network create test-net

      - name: Start PostgreSQL
        run: |
          podman rm -f test-db || true

          podman run -d \
            --name test-db \
            --network test-net \
            --network-alias test-db \
            -e POSTGRES_DB=kubsu \
            -e POSTGRES_USER=kubsu \
            -e POSTGRES_PASSWORD=kubsu \
            postgres:15-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if podman exec test-db pg_isready -U kubsu >/dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done

      - name: Build test image
        run: |
          podman build \
            -t kubsu/python-crud:test \
            --target test \
            ./docker

      - name: Run tests
        run: |
          # Используем IP вместо hostname — обход проблемы aardvark-dns в rootless Podman
          DB_IP=$(podman inspect test-db --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "Test DB IP: $DB_IP"
          podman run --rm \
            --network test-net \
            -e DATABASE_URL="postgresql+psycopg://kubsu:kubsu@${DB_IP}:5432/kubsu" \
            kubsu/python-crud:test

      - name: Cleanup
        if: always()
        run: |
          podman rm -f test-db || true
          podman image rm -f kubsu/python-crud:test || true

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up disk space before deploy
        run: |
          echo "=== Checking disk space before cleanup ==="
          df -h /
          echo "=== Cleaning up old containers and images ==="
          podman container prune -f || true
          podman image prune -f || true
          podman system prune -f || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Login to Docker Hub
        run: |
          podman login docker.io \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build runtime image
        run: |
          podman build \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest \
            --target runtime \
            ./docker

      - name: Push image
        run: |
          podman push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

      - name: Deploy application
        run: |
          echo "=== Resetting podman network state ==="
          pkill -f aardvark-dns || true
          pkill -f netavark || true

          echo "=== Recreating network ==="
          podman network rm -f kubsu-net || true
          podman network create kubsu-net

          echo "=== Removing old containers ==="
          podman rm -f kubsu-db || true
          podman rm -f kubsu-crud || true

          echo "=== Starting PostgreSQL ==="
          podman run -d \
            --name kubsu-db \
            --network kubsu-net \
            --network-alias kubsu-db \
            -e POSTGRES_DB=kubsu \
            -e POSTGRES_USER=kubsu \
            -e POSTGRES_PASSWORD=kubsu \
            postgres:15-alpine

          echo "=== Waiting for PostgreSQL to be ready ==="
          for i in {1..30}; do
            if podman exec kubsu-db pg_isready -U kubsu >/dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done

          echo "=== Getting DB container IP (bypass DNS issues) ==="
          DB_IP=$(podman inspect kubsu-db --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "DB IP: $DB_IP"

          echo "=== Starting application ==="
          podman run -d \
            --name kubsu-crud \
            --network kubsu-net \
            --network-alias kubsu-crud \
            -p 8120:8120 \
            --restart unless-stopped \
            -e PORT=8120 \
            -e DATABASE_URL="postgresql+psycopg://kubsu:kubsu@${DB_IP}:5432/kubsu" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

      - name: Verify deployment
        run: |
          echo "=== Waiting for application to start ==="
          sleep 10

          echo "=== Container status ==="
          podman ps -a

          echo "=== Application logs ==="
          podman logs --tail 50 kubsu-crud || true

          echo "=== Database logs ==="
          podman logs --tail 20 kubsu-db || true

          echo "=== Testing connectivity from app container ==="
          DB_IP=$(podman inspect kubsu-db --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          podman exec kubsu-crud python -c "
          import socket
          try:
              s = socket.create_connection(('${DB_IP}', 5432), timeout=5)
              s.close()
              print('✅ Connection to DB on ${DB_IP}:5432 OK')
          except Exception as e:
              print(f'❌ Connection failed: {e}')
          " || true

          echo "=== Testing application connectivity ==="
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8120/users/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "Application is responding! (HTTP $HTTP_CODE)"
              break
            fi
            echo "Waiting for application to respond... ($i/15) - HTTP $HTTP_CODE"
            sleep 2
          done

          echo "=== Testing API endpoints ==="
          echo "GET /users/ response:"
          curl -s http://localhost:8120/users/ | head -c 200 || echo "No response"

          echo ""
          echo "=== Creating test user ==="
          curl -s -X POST http://localhost:8120/users/ \
            -H "Content-Type: application/json" \
            -d '{"name": "Test User"}' || echo "Failed to create user"

          echo ""
          echo "=== Deployment verification completed ==="

      - name: Health check
        if: always()
        run: |
          echo "=== Running health checks ==="

          if podman ps | grep -q kubsu-crud; then
            echo "kubsu-crud container is running"
          else
            echo "kubsu-crud container is not running"
            echo "Last logs:"
            podman logs --tail 30 kubsu-crud || true
            exit 1
          fi

          if podman ps | grep -q kubsu-db; then
            echo "kubsu-db container is running"
          else
            echo "kubsu-db container is not running"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8120/users/ 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "Application is accessible on port 8120 (HTTP $HTTP_CODE)"
          else
            echo "Application is not accessible on port 8120 (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "=== All health checks passed ==="

      - name: Cleanup old images
        if: always()
        run: |
          echo "=== Final cleanup ==="
          podman image prune -f || true
          podman container prune -f || true
          echo "=== Disk space after deployment ==="
          df -h /
