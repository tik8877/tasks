name: Docker CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: kubsu
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
        options: >-
          --health-cmd="pg_isready -U kubsu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Build TEST image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          target: test
          tags: kubsu-crud:test
          load: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://kubsu:kubsu@localhost:5432/kubsu
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            kubsu-crud:test


  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push runtime image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          target: runtime
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

      # ❗ ВАЖНО: без TCP check (он ломал pipeline)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: kubsu.tyvik.ru
          port: ${{ secrets.REMOTE_SSH_PORT }}
          username: ${{ secrets.REMOTE_SSH_USER }}
          key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "=== DEPLOY START ==="

            command -v podman >/dev/null || { echo "podman not installed"; exit 1; }

            podman network create kubsu-net || true

            podman stop kubsu-db || true
            podman rm kubsu-db || true
            podman stop kubsu-crud || true
            podman rm kubsu-crud || true

            podman login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            podman pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

            podman run -d \
              --name kubsu-db \
              --network kubsu-net \
              -e POSTGRES_DB=kubsu \
              -e POSTGRES_USER=kubsu \
              -e POSTGRES_PASSWORD=kubsu \
              postgres:15-alpine

            until podman exec kubsu-db pg_isready -U kubsu >/dev/null 2>&1; do sleep 1; done

            podman run -d \
              --name kubsu-crud \
              --network kubsu-net \
              -p 8120:8120 \
              --restart unless-stopped \
              -e PORT=8120 \
              -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@kubsu-db:5432/kubsu \
              docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

            echo "=== DEPLOY DONE ==="

