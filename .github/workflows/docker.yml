name: Docker CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test network
        run: |
          podman network create test-net || true

      - name: Start PostgreSQL
        run: |
          podman rm -f test-db || true

          podman run -d \
            --name test-db \
            --network test-net \
            -e POSTGRES_DB=kubsu \
            -e POSTGRES_USER=kubsu \
            -e POSTGRES_PASSWORD=kubsu \
            postgres:15-alpine

          until podman exec test-db pg_isready -U kubsu >/dev/null 2>&1
          do
            sleep 1
          done

      - name: Build test image
        run: |
          podman build \
            -t kubsu/python-crud:test \
            --target test \
            ./docker

      - name: Run tests
        run: |
          podman run --rm \
            --network test-net \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@test-db:5432/kubsu \
            kubsu/python-crud:test

      - name: Cleanup
        if: always()
        run: |
          podman rm -f test-db || true

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          podman login docker.io \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build runtime image
        run: |
          podman build \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest \
            --target runtime \
            ./docker

      - name: Push image
        run: |
          podman push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest

      - name: Deploy application
        run: |
          podman network create kubsu-net || true

          podman rm -f kubsu-db || true
          podman rm -f kubsu-crud || true

          podman run -d \
            --name kubsu-db \
            --network kubsu-net \
            -e POSTGRES_DB=kubsu \
            -e POSTGRES_USER=kubsu \
            -e POSTGRES_PASSWORD=kubsu \
            postgres:15-alpine

          until podman exec kubsu-db pg_isready -U kubsu >/dev/null 2>&1
          do
            sleep 1
          done

          podman run -d \
            --name kubsu-crud \
            --network kubsu-net \
            -p 8120:8120 \
            --restart unless-stopped \
            -e PORT=8120 \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@kubsu-db:5432/kubsu \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kubsu-crud:latest
